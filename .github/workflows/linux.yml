name: Linux build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - name: Build and test
        run: |
          rustup update stable
          cargo test --locked
          cargo build --release --locked
      - name: Package game
        run: |
          mkdir -p dist/snailwars
          cp target/release/snailwars run.sh dist/snailwars/
          cp -a assets dist/snailwars/
          tar -czf snailwars-linux-x86_64.tar.gz -C dist snailwars
      - uses: actions/upload-artifact@v4
        with:
          name: snailwars-linux-x86_64
          path: snailwars-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snailwars-linux-x86_64
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" snailwars-linux-x86_64.tar.gz --generate-notes --verify-tag
